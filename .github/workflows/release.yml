name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish the installer under (leave empty to build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check:
    # The engine logic is plain std Rust, so prove it on a fast runner before
    # spending minutes on a Windows bundle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test the engine module on its own
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/enginecheck/src /tmp/enginecheck/tests
          cp engines.rs /tmp/enginecheck/src/lib.rs
          # The live test spawns a stand-in core that really binds the port, so
          # a supervisor that silently stopped working fails here.
          sed 's/use engcheck::\*;/use enginecheck::*;/' live.rs > /tmp/enginecheck/tests/live.rs
          cat > /tmp/enginecheck/Cargo.toml <<'TOML'
          [package]
          name = "enginecheck"
          version = "0.0.0"
          edition = "2021"
          TOML
          cd /tmp/enginecheck
          cargo test

  build:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble the project layout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          bash assemble.sh
          ls -la src-tauri/icons src/

      - name: Fetch the Aether core
        shell: bash
        env:
          AETHER_VERSION: v2.0.0
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources
          asset="aether-windows-x86_64.zip"
          base="https://github.com/CluvexStudio/Aether/releases/download/${AETHER_VERSION}"
          curl -fsSL -o /tmp/aether.zip "$base/$asset"
          curl -fsSL -o /tmp/aether.sha256 "$base/$asset.sha256" || true
          if [ -s /tmp/aether.sha256 ]; then
            want=$(tr -d '\r' < /tmp/aether.sha256 | awk '{print $1}')
            got=$(sha256sum /tmp/aether.zip | awk '{print $1}')
            if [ "$want" != "$got" ]; then
              echo "Aether checksum mismatch: expected $want, got $got" >&2
              exit 1
            fi
            echo "checksum verified"
          else
            echo "no checksum published for $asset - continuing without it" >&2
          fi
          # Git Bash on the Windows runner has no unzip, but it does have the
          # Python we just installed Pillow into.
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" /tmp/aether.zip /tmp/aether
          exe=$(find /tmp/aether -name 'aether*.exe' | head -n 1)
          if [ -z "$exe" ]; then
            echo "aether.exe was not in the archive; contents were:" >&2
            find /tmp/aether -type f >&2
            exit 1
          fi
          cp "$exe" src-tauri/resources/aether.exe

      - name: Build the Global core
        shell: bash
        env:
          GLOBAL_CORE_VERSION: v2.0.40
        run: |
          set -euo pipefail
          # No Windows binary is published, but the core is plain Go, so it is
          # built from the same tag the Android build pins. Building beats
          # trusting an unpublished asset.
          git clone --quiet --branch "$GLOBAL_CORE_VERSION" --depth 1 \
            https://github.com/Psiphon-Labs/psiphon-tunnel-core.git /tmp/global-src
          cd /tmp/global-src
          echo "building ConsoleClient with $(go version)"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o /tmp/global.exe ./ConsoleClient
          cd "$GITHUB_WORKSPACE"
          cp /tmp/global.exe src-tauri/resources/global.exe

      - name: Refuse to ship without the core
        shell: bash
        run: |
          set -euo pipefail
          test -s src-tauri/resources/aether.exe
          test -s src-tauri/resources/global.exe
          test -s src-tauri/icons/icon.ico
          test -s src/logo.png
          echo "aether: $(wc -c < src-tauri/resources/aether.exe) bytes"
          echo "global: $(wc -c < src-tauri/resources/global.exe) bytes"

      - name: Build the installer
        run: cargo tauri build --verbose
        working-directory: .

      - name: Collect the artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' \) -print -exec cp {} dist/ \;
          test -n "$(ls -A dist)" || { echo "no installer was produced" >&2; exit 1; }
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: Panther-Desktop-Windows
          path: dist/*

      - name: Publish the failure log
        if: failure()
        shell: bash
        run: |
          echo "The build failed. Open the step above marked with a red cross for the reason." >&2

      - name: Publish the release
        if: success() && (github.event_name == 'push' || inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
